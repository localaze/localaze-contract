name: Bug report
description: Something does not work as the README or the contract says it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The smallest code or steps that show it.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: onDiagnostic output
      description: Pass an onDiagnostic callback and paste what it printed. Remove your API key.
      render: text
  - type: input
    id: version
    attributes:
      label: SDK version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and toolchain versions
